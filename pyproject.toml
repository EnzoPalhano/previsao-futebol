[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "previsao-futebol"
version = "0.1.0"
description = "Previsão probabilística de futebol com backtest honesto de apostas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enzo Palhano" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
]

# Layout src/: o pacote "futebol" mora em src/futebol.
# Sem esta declaracao + `pip install -e .`, o pytest NAO encontra o pacote.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "lento: testes que demoram (download, treino completo)",
    "rede: testes que precisam de internet (nao rodam no CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (ordem dos imports)
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplificacoes
]
ignore = [
    "E501",  # comprimento de linha ja controlado por line-length
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
