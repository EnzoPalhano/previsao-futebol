# ============================================================================
# Configuracao central do projeto.
# Tudo que o Enzo pode querer mudar sem mexer em codigo fica aqui.
# Especificacao completa: PROJETO_PREVISAO_FUTEBOL.md
# ============================================================================

# Semente aleatoria fixa: garante que rodar duas vezes da o mesmo resultado.
seed: 42

# ----------------------------------------------------------------------------
# LIGAS
# ----------------------------------------------------------------------------
# GRUPO 1 (formato A/B, pasta mmz4281): tem odds PRE-JOGO e de FECHAMENTO,
#   para 1X2 e Over/Under 2,5. Sao as unicas que podem entrar no BACKTEST e no CLV.
# GRUPO 2 (formato C, pasta new/): SO tem odds de fechamento de 1X2.
#   Servem para TREINO e CALIBRACAO. Nunca para backtest nem CLV.
# Ver secoes 4.2 e 4.4 da especificacao.
# ----------------------------------------------------------------------------
ligas:
  # Camada ativa. Troque aqui para ampliar o escopo.
  ativa: camada_tudo

  camadas:
    # Rapido de rodar, para estudar e validar o pipeline inteiro.
    camada_aprendizado:
      grupo1: [E0]
      grupo2: []

    # Margens baixas, mercados mais eficientes.
    camada_principal:
      grupo1: [E0, SP1, D1, I1, F1, N1, P1, B1]
      grupo2: [BRA]

    # Todas as 22 ligas que podem ser apostadas.
    camada_completa_backtest:
      grupo1: [E0, E1, E2, E3, EC, SC0, SC1, SC2, SC3, D1, D2, I1, I2,
               SP1, SP2, F1, F2, N1, B1, P1, T1, G1]
      grupo2: []

    # Tudo: 22 ligas apostaveis + 16 paises so para treino/calibracao.
    camada_tudo:
      grupo1: [E0, E1, E2, E3, EC, SC0, SC1, SC2, SC3, D1, D2, I1, I2,
               SP1, SP2, F1, F2, N1, B1, P1, T1, G1]
      grupo2: [ARG, AUT, BRA, CHN, DNK, FIN, IRL, JPN, MEX, NOR, POL,
               ROU, RUS, SWE, SWZ, USA]

# Temporadas do Grupo 1, no formato do site (2425 = temporada 2024/25).
# 1920 em diante = formato moderno (tem tudo).
# Antes disso = formato legado (sem fechamento de Over/Under).
temporadas:
  grupo1: [1920, 2021, 2122, 2223, 2324, 2425, 2526]
  # Grupo 2 vem em arquivo unico com todas as temporadas; filtramos por ano aqui.
  grupo2_ano_minimo: 2012

# ----------------------------------------------------------------------------
# FONTES DE DADOS
# ----------------------------------------------------------------------------
fontes:
  url_grupo1: "https://www.football-data.co.uk/mmz4281/{temporada}/{liga}.csv"
  url_grupo2: "https://www.football-data.co.uk/new/{pais}.csv"
  # O site responde com HTTP 302: e preciso seguir redirecionamento e mandar User-Agent.
  user_agent: "Mozilla/5.0 (projeto academico previsao-futebol)"
  timeout_segundos: 30

# ----------------------------------------------------------------------------
# FILTRO DE QUALIDADE DE MERCADO  (aplicado na Fase 2)
# ----------------------------------------------------------------------------
# Em vez de escolher "as ligas boas" no chute, o projeto mede e o dado decide.
filtro_qualidade_mercado:
  margem_maxima: 0.08           # descarta ligas acima de 8% de margem
  cobertura_minima_odds: 0.90   # pelo menos 90% dos jogos com odds
  jogos_minimos: 1000           # historico suficiente para treinar
  # Calibracao: o ECE cru pune liga pequena (com 1.200 jogos ele e alto mesmo
  # num mercado perfeito). Por isso o corte e relativo ao piso de ruido da
  # propria liga. Limite fixado na Fase 2, DEPOIS de ver os numeros - nenhuma
  # liga foi reprovada por ele. Ver docs/relatorios/fase2.md.
  fator_ece_maximo: 2.0

# Ligas aprovadas para BACKTEST DE APOSTAS, escolhidas pelo filtro acima na
# Fase 2 (nao por escolha manual). Regerar com: python scripts/filtro_ligas.py
ligas_aprovadas_backtest: [B1, D1, D2, E0, E1, E2, E3, F1, F2, G1, I1, I2, N1, P1, SC0, SP1, SP2, T1]

# ----------------------------------------------------------------------------
# MODELOS
# ----------------------------------------------------------------------------
modelos:
  poisson:
    max_gols: 10                # tamanho da matriz de placares (0 a 10)
    # "por_liga": cada liga estima o seu fator casa. "global": um numero so,
    # medido em todas as ligas juntas. Comparacao em docs/relatorios/fase3.md.
    fator_casa: por_liga
  dixon_coles:
    max_gols: 10
    # Decaimento temporal, por dia. Meia-vida = ln(2)/xi ~ 231 dias.
    # ESCOLHIDO pelo walk-forward de validacao da Fase 4 (regra 9), em
    # 17/09/2026: menor log loss entre as 13 configuracoes candidatas.
    # Ver docs/relatorios/fase4.md, secao 4. Nao mexer olhando o teste final.
    xi: 0.003
  elo:
    k: 20
    rating_inicial: 1500
    # Vantagem de jogar em casa, em PONTOS DE ELO, somada ao mandante no calculo
    # da expectativa. MEDIDA, nao chutada: nos 53.009 jogos anteriores ao inicio
    # da janela de validacao o mandante somou 0,5719 ponto por jogo, e a
    # diferenca de Elo que produz isso entre dois times iguais e
    # -400*log10(1/0,5719 - 1) = 50,3. Congelada dai, como o fator casa unico da
    # Fase 4: nenhum jogo da janela avaliada entrou nesta conta.
    # ATENCAO: varia muito por pais (20 no Japao, 32 na Inglaterra, 90 no Brasil,
    # 99 nos EUA). Um numero so e simplificacao consciente - quem carrega a
    # vantagem de casa por competicao e o Dixon-Coles, que tambem e feature.
    vantagem_casa: 50
  # ENCOLHIMENTO (shrinkage) das forcas de ataque e defesa para a media da liga.
  # jogos_equivalentes = quantos jogos de historia a media da liga vale:
  #     forca do time ~ (n / (n + jogos_equivalentes)) * forca que os jogos dele pedem
  # Com 6, um time com 6 jogos fica na metade do caminho entre "media da liga" e
  # "o que os jogos dele dizem"; um time recem-promovido, sem jogo naquela
  # divisao, e previsto como um time medio dela. Ver src/futebol/modelos/poisson.py.
  # ESCOLHIDO pelo walk-forward da Fase 4 (regra 9): m = 6 tem a menor log
  # loss da grade (1, 2, 6, 12, 20), com a curva rasa na vizinhanca. O valor
  # e o mesmo que a Fase 3 usava; a diferenca e que agora foi medido.
  shrinkage:
    jogos_equivalentes: 6

# ----------------------------------------------------------------------------
# BACKTEST
# ----------------------------------------------------------------------------
backtest:
  # REGRA 2.6a: apostar SEMPRE na odd media pre-jogo. Nunca na Max.
  coluna_odd_aposta: "odd_pre"
  coluna_odd_clv: "odd_fech"
  ev_minimo: 0.05               # so aposta quando EV > 5%
  banca_inicial: 1000.0
  estrategia: "stake_fixa"      # stake_fixa | kelly_fracionado
  stake_fixa_pct: 0.01          # 1% da banca
  kelly_fracao: 0.25            # 1/4 de Kelly
  kelly_teto_pct: 0.05          # teto de 5% da banca por aposta
  tipo_banca: "fixa"            # fixa | composta  (reportar as DUAS)
  bootstrap_amostras: 10000

# ----------------------------------------------------------------------------
# MULTIPLAS
# ----------------------------------------------------------------------------
multiplas:
  min_selecoes: 1
  max_selecoes: 10
  odd_minima_selecao: 1.20
  odd_maxima_selecao: 5.00
  uma_selecao_por_jogo: true    # OBRIGATORIO: mercados do mesmo jogo sao correlacionados
  beam_width: 50                # busca em feixe, nao forca bruta
  cash_out_margem_casa: 0.08    # oferta da casa ~8% abaixo do valor justo

# ----------------------------------------------------------------------------
# AVALIACAO
# ----------------------------------------------------------------------------
avaliacao:
  # Temporadas de TESTE FINAL: abrir UMA UNICA VEZ, na Fase 9.
  temporadas_teste_final: [2425, 2526]
  metrica_selecao_modelo: "log_loss"   # REGRA 2.6b: nunca selecionar por ROI

# ----------------------------------------------------------------------------
# FASE 10 - NOTICIAS E DESFALQUES
# ----------------------------------------------------------------------------
noticias:
  dias_a_frente: 7
  janela_noticias_horas: 72
  # 100/dia e o teto do plano GRATUITO da API-Football (confere em
  # api-football.com/pricing). A cota zera as 00:00 UTC e o que sobra nao
  # acumula. Estava 200 aqui, que estouraria a cota silenciosamente.
  limite_chamadas_dia: 100
  cache_horas: 4                # a API atualiza lesoes a cada 4h; cachear mais
                                # que isso guardaria informacao velha
  # Modelo que LE as noticias e devolve JSON. Ele nao calcula probabilidade
  # nenhuma - quem faz isso e o Dixon-Coles. A tarefa e leitura de texto curto,
  # entao um modelo menor (claude-haiku-4-5) da conta e custa menos; o padrao
  # e o mais capaz.
  modelo_extracao: "claude-opus-5"
  peso_duvida: 0.5              # jogador "duvida" pesa metade de um "fora"
  ajuste_maximo: 0.25           # limite de reducao da forca do time
